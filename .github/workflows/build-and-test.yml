name: build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # NOTE: Runners only provide bash (even on macOS).
    # NOTE: -i to load the bashrc settings.
    shell: bash -ieo pipefail {0}


on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: 
          - ubuntu-22.04
          - macos-13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          # Let homebrew manage python instead of the 3rd party-install.
          python_version_number=3.12
          framework_path="/Library/Frameworks/Python.framework/Versions/${python_version_number}"
          if [ -d /usr/local/bin ]; then
            while IFS= read -r link_path; do
              target="$(readlink "${link_path}" || true)"
              if [[ "${target}" == *"${framework_path}"* ]]; then
                sudo rm -f "${link_path}"
              fi
            done < <(find /usr/local/bin -maxdepth 1 -type l -print)
          fi
        if: runner.os == 'macOS'
      - run: ./bin/bootstrap.sh
      - run: |
          mkdir build
          pushd build
          cmake ../
          make -j2
          popd
      - run: ./bin/runtests.sh
      - name: Upload Linux build artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        with:
          path: build
          name: linux-build-${{ github.run_id }}
          retention-days: 1
  code-coverage:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download Linux build artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: linux-build-${{ github.run_id }}
          path: build
      - run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends lcov
      - run: ./bin/gencov.sh
      - uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
        with:
          files: ./coverage.info
          flags: codecoverage 
  docs:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends lcov doxygen graphviz python3 python3-pip python3-setuptools
      - run: python3 -m pip install coverxygen
      - run: ./bin/gendocs.sh
      - uses: JamesIves/github-pages-deploy-action@6c2d9db40f9296374acc17b90404b6e8864128c8 # v4.7.3
        with:
          branch: gh-pages
          folder: docs/html
      - uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
        with:
          files: ./docs/doc-coverage.info
          flags: doccoverage 
